<script type="module">
// ByteWise Python episode engine: 1920x1080, all 2D canvas. Data: news.json (words, chunks, P, end) + ep.json {"ep": 12, "topic": "Inheritance"}.
const cv = document.getElementById("c"); const cmain = cv.getContext("2d"); let c = cmain;
const layer = document.createElement("canvas"); layer.width = 1920; layer.height = 1080; const clay = layer.getContext("2d");
const badge = new Image(); badge.src = "badge.png";
const NJ = await (await fetch("news.json")).json(); const EP = await (await fetch("ep.json")).json();
const WORDS = NJ.words, P = NJ.P, PS = P.map(p => p[0]), END = NJ.end + .8;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)); const prog = (t, a, d) => clamp((t - a) / d);
const ease = u => 1 - Math.pow(1 - u, 3); const back = u => { const s = 1.7; u -= 1; return u * u * ((s + 1) * u + s) + 1; };

// W("word", para, after): time the word starts (first match in that paragraph after `after`)
const W = (w, para, after = -1) => { const k = w.toLowerCase().replace(/[^a-z0-9]/g, ""); const x = WORDS.find(v => v[3] === para && v[0] > after && v[2].toLowerCase().replace(/[^a-z0-9]/g, "").startsWith(k)); return x ? x[0] : PS[para]; };
const sceneAt = t => { let i = 0; for (let k = 0; k < PS.length; k++) if (t >= PS[k] - .001) i = k; return i; };
const ORG = "#ff6a2b", YEL = "#ffd23a", CREAM = "#f3efe6", GREY = "#9aa0b4";
// ---------------- glow sketch toolkit ----------------
// Neon lines that draw themselves (hand-drawn wobble, glow, bright pen tip). Draws on the current scene canvas `c`.
// gsketch(shape, t, t0, dur, color, width, seed): shape = array of points [[x,y],...] or array of such paths.
// Shapes: GS.rect(x,y,w,h) GS.circle(cx,cy,r) GS.arc(cx,cy,r,a0,a1) GS.line(x1,y1,x2,y2) GS.arrow(x1,y1,x2,y2)
//   GS.laptop(x,y,s) GS.phone(x,y,s) GS.cloud(x,y,s) GS.server(x,y,s) GS.lock(x,y,s) GS.chip(x,y,s) GS.globe(x,y,s)
//   GS.chart(x,y,s) GS.doc(x,y,s) GS.house(x,y,s) GS.key(x,y,s) GS.wifi(x,y,s) GS.check(x,y,s) GS.cross(x,y,s)
// gflow(path, t, t0, color): dots travelling along a path after it is drawn. gtype(text, x, y, size, color, t, t0, dur): neon text typing in.
const GCY = "#5ee7ff", GOR = "#ff6a2b", GYE = "#ffd23a", GGR = "#4ade80", GRD = "#ff4d5e";
const GS = {
  line: (a, b, c2, d) => [[a, b], [c2, d]],
  rect: (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]],
  arc: (cx, cy, r, a0, a1, n = 40) => Array.from({ length: n + 1 }, (_, i) => { const a = a0 + (a1 - a0) * i / n; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; }),
  circle: (cx, cy, r) => GS.arc(cx, cy, r, -Math.PI / 2, Math.PI * 1.5, 60),
  arrow: (x1, y1, x2, y2) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 34; return [[[x1, y1], [x2, y2]], [[x2 - h * Math.cos(a - .5), y2 - h * Math.sin(a - .5)], [x2, y2], [x2 - h * Math.cos(a + .5), y2 - h * Math.sin(a + .5)]]]; },
  laptop: (x, y, s) => [GS.rect(x - 1.5 * s, y - s, 3 * s, 1.9 * s), [[x - 1.9 * s, y + .9 * s], [x + 1.9 * s, y + .9 * s], [x + 2.1 * s, y + 1.15 * s], [x - 2.1 * s, y + 1.15 * s], [x - 1.9 * s, y + .9 * s]]],
  phone: (x, y, s) => [GS.rect(x - .8 * s, y - 1.5 * s, 1.6 * s, 3 * s), GS.line(x - .2 * s, y + 1.25 * s, x + .2 * s, y + 1.25 * s)],
  cloud: (x, y, s) => [[...GS.arc(x - .7 * s, y, .55 * s, Math.PI * .95, Math.PI * 1.95), ...GS.arc(x + .1 * s, y - .25 * s, .7 * s, Math.PI * 1.2, Math.PI * 2.05), ...GS.arc(x + .85 * s, y + .15 * s, .5 * s, Math.PI * 1.5, Math.PI * 2.5), [x + .85 * s, y + .65 * s], [x - .9 * s, y + .65 * s], ...GS.arc(x - .9 * s, y + .3 * s, .35 * s, Math.PI * .5, Math.PI * 1.05)]],
  server: (x, y, s) => [GS.rect(x - s, y - 1.4 * s, 2 * s, .8 * s), GS.rect(x - s, y - .4 * s, 2 * s, .8 * s), GS.rect(x - s, y + .6 * s, 2 * s, .8 * s), GS.line(x + .5 * s, y - s, x + .7 * s, y - s), GS.line(x + .5 * s, y, x + .7 * s, y), GS.line(x + .5 * s, y + s, x + .7 * s, y + s)],
  lock: (x, y, s) => [GS.rect(x - .6 * s, y - .1 * s, 1.2 * s, .9 * s), GS.arc(x, y - .1 * s, .4 * s, Math.PI, Math.PI * 2, 18)],
  chip: (x, y, s) => { const o = [GS.rect(x - s, y - s, 2 * s, 2 * s), GS.rect(x - .45 * s, y - .45 * s, .9 * s, .9 * s)]; for (let k = -2; k <= 2; k++) { const d = k * .38 * s; o.push(GS.line(x + d, y - s, x + d, y - 1.35 * s), GS.line(x + d, y + s, x + d, y + 1.35 * s), GS.line(x - s, y + d, x - 1.35 * s, y + d), GS.line(x + s, y + d, x + 1.35 * s, y + d)); } return o; },
  globe: (x, y, s) => [GS.circle(x, y, s), GS.line(x - s, y, x + s, y), GS.arc(x, y, s, -Math.PI / 2, Math.PI / 2).map(([a, b]) => [x + (a - x) * .45, b]), GS.arc(x, y, s, Math.PI / 2, Math.PI * 1.5).map(([a, b]) => [x + (a - x) * .45, b])],
  chart: (x, y, s) => [[[x - 1.2 * s, y - 1.1 * s], [x - 1.2 * s, y + s], [x + 1.3 * s, y + s]], [[x - .9 * s, y + .5 * s], [x - .3 * s, y], [x + .2 * s, y + .25 * s], [x + 1.1 * s, y - .8 * s]]],
  doc: (x, y, s) => [[[x - .8 * s, y - s], [x + .4 * s, y - s], [x + .8 * s, y - .6 * s], [x + .8 * s, y + s], [x - .8 * s, y + s], [x - .8 * s, y - s]], GS.line(x - .5 * s, y - .3 * s, x + .5 * s, y - .3 * s), GS.line(x - .5 * s, y + .1 * s, x + .5 * s, y + .1 * s), GS.line(x - .5 * s, y + .5 * s, x + .2 * s, y + .5 * s)],
  house: (x, y, s) => [[[x - s, y], [x, y - s], [x + s, y]], GS.rect(x - .75 * s, y - .1 * s, 1.5 * s, 1.1 * s)],
  key: (x, y, s) => [GS.circle(x - .6 * s, y, .35 * s), [[x - .25 * s, y], [x + s, y], [x + s, y + .3 * s]], GS.line(x + .6 * s, y, x + .6 * s, y + .25 * s)],
  wifi: (x, y, s) => [GS.arc(x, y + .6 * s, 1.2 * s, Math.PI * 1.25, Math.PI * 1.75, 20), GS.arc(x, y + .6 * s, .8 * s, Math.PI * 1.25, Math.PI * 1.75, 16), GS.arc(x, y + .6 * s, .4 * s, Math.PI * 1.25, Math.PI * 1.75, 12)],
  check: (x, y, s) => [[[x - .6 * s, y], [x - .15 * s, y + .45 * s], [x + .7 * s, y - .5 * s]]],
  cross: (x, y, s) => [GS.line(x - .6 * s, y - .6 * s, x + .6 * s, y + .6 * s), GS.line(x + .6 * s, y - .6 * s, x - .6 * s, y + .6 * s)],
};
function _gwob(pts, seed, amp) { const r = rand(seed), o = []; for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1], n = Math.max(2, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / 14)); for (let k = 0; k < n; k++) { const q = k / n; o.push([a[0] + (b[0] - a[0]) * q + (r() - .5) * amp, a[1] + (b[1] - a[1]) * q + (r() - .5) * amp]); } } o.push(pts[pts.length - 1]); return o; }
const _gcache = new Map();
function gsketch(shape, t, t0, dur, col = GCY, w = 7, seed = 1) {
  if (t < t0) return; const paths = Array.isArray(shape[0][0]) ? shape : [shape];
  const key = JSON.stringify([paths.length, paths[0][0], seed]); let P = _gcache.get(key);
  if (!P) { P = paths.map((p, i) => { const q = _gwob(p, seed * 7 + i, 5); let L = 0; for (let k = 1; k < q.length; k++) L += Math.hypot(q[k][0] - q[k - 1][0], q[k][1] - q[k - 1][1]); return { q, L }; }); _gcache.set(key, P); }
  const total = P.reduce((a, p) => a + p.L, 0); let need = total * clamp((t - t0) / dur), head = null;
  c.save(); c.lineCap = "round"; c.lineJoin = "round";
  for (const [blur, lw, al, stroke] of [[38, w * 3, .32, col], [16, w * 1.6, .6, col], [0, w * .55, 1, "#fff"]]) {
    c.shadowColor = col; c.shadowBlur = blur; c.strokeStyle = stroke; c.globalAlpha = al; c.lineWidth = lw; let rem = need;
    for (const { q, L } of P) { if (rem <= 0) break; c.beginPath(); c.moveTo(...q[0]); let acc = 0;
      for (let k = 1; k < q.length; k++) { const d = Math.hypot(q[k][0] - q[k - 1][0], q[k][1] - q[k - 1][1]); if (acc + d >= rem) { const f = (rem - acc) / d; head = [q[k - 1][0] + (q[k][0] - q[k - 1][0]) * f, q[k - 1][1] + (q[k][1] - q[k - 1][1]) * f]; c.lineTo(...head); acc = rem; break; } acc += d; c.lineTo(...q[k]); }
      c.stroke(); rem -= L; if (rem > 0) head = null; }
  }
  if (head && need < total) { c.globalAlpha = 1; c.shadowBlur = 50; c.shadowColor = "#fff"; c.fillStyle = "#fff"; c.beginPath(); c.arc(head[0], head[1], 9, 0, 7); c.fill(); }
  c.restore();
}
function gflow(path, t, t0, col = GYE, n = 4, speed = .9) { if (t < t0) return; const p = Array.isArray(path[0][0]) ? path[0] : path; const a = p[0], b = p[p.length - 1];
  for (let k = 0; k < n; k++) { const q = ((t - t0) * speed + k / n) % 1; c.save(); c.shadowColor = col; c.shadowBlur = 25; c.fillStyle = col; c.beginPath(); c.arc(a[0] + (b[0] - a[0]) * q, a[1] + (b[1] - a[1]) * q, 8, 0, 7); c.fill(); c.restore(); } }
function gtype(s, x, y, size, col, t, t0, dur = .6, align = "left") { if (t < t0) return; const n = Math.floor(s.length * clamp((t - t0) / dur));
  c.save(); c.font = `${size}px Anton`; c.textAlign = align; c.shadowColor = col; c.shadowBlur = 30; c.fillStyle = col; c.fillText(s.slice(0, n), x, y); c.restore(); }


function txt(s, x, y, f, col, al = "left", a = 1) { c.save(); c.globalAlpha *= a; c.font = f; c.fillStyle = col; c.textAlign = al; c.fillText(s, x, y); c.restore(); }
function rr(x, y, w, h, r, fill, stroke, lw = 2) { c.beginPath(); c.roundRect(x, y, w, h, r); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); } }
// --- code window: lines typed at given times; syntax colours; blinking cursor ---
function codeLine(s, x, y, size) { c.font = `${size}px Mono`; let cx = x; const toks = s.match(/(\s+|"[^"]*"|'[^']*'|#.*|[A-Za-z_][A-Za-z_0-9]*|\d+|[^\sA-Za-z_0-9"']+)/g) || [];
  for (const tk of toks) { let col = "#e6e6f0"; if (tk.startsWith("#")) col = "#6c7086"; else if (tk.startsWith('"') || tk.startsWith("'")) col = "#a6e3a1";
    else if (["class", "def", "return", "if", "elif", "else", "for", "while", "in", "import", "from", "try", "except", "with", "as", "and", "or", "not", "lambda", "True", "False", "None"].includes(tk)) col = "#ff7ab8";
    else if (["print", "len", "range", "input", "int", "str", "list", "dict", "set", "tuple", "open", "super"].includes(tk)) col = "#89dceb"; else if (tk === "self") col = "#f9a875";
    else if (/^\d+$/.test(tk)) col = "#fab387"; else if (/^[A-Z]/.test(tk)) col = YEL; else if (/^[():.=,\[\]{}+\-*/<>]+$/.test(tk)) col = GREY;
    c.fillStyle = col; c.fillText(tk, cx, y); cx += c.measureText(tk).width; } return cx; }
function codeWin(t, x, y, w, h, lines, times, { title = "main.py", size = 34, gap = 46, a = 1, hi = null } = {}) {
  c.save(); c.globalAlpha *= a; rr(x, y, w, h, 24, "rgba(13,17,30,.94)", "rgba(255,255,255,.18)", 2);
  ["#ff5f57", "#ffbd2e", "#28c840"].forEach((cc, k) => { c.beginPath(); c.arc(x + 34 + k * 28, y + 30, 9, 0, 7); c.fillStyle = cc; c.fill(); }); txt(title, x + w / 2, y + 40, "26px Mono", GREY, "center");
  lines.forEach((ln, i) => { const t0 = times[i]; if (!ln || t0 === undefined || t < t0) return; const n = Math.floor(ln.length * clamp((t - t0) / Math.max(.2, ln.length * .028)));
    if (hi !== null && hi[0] === i && t > hi[1]) rr(x + 16, y + 74 + i * gap, w - 32, gap - 4, 8, "rgba(255,106,43,.18)");
    const ex = codeLine(ln.slice(0, n), x + 40, y + 100 + i * gap, size);
    if (n < ln.length && (t * 4) % 1 < .6) { c.fillStyle = ORG; c.fillRect(ex + 2, y + 72 + i * gap, size * .45, size * 1.05); } });
  c.restore(); }
function outputWin(t, x, y, w, lines, t0, { a = 1 } = {}) { if (t < t0) return; const u = ease(prog(t, t0, .3)); c.save(); c.globalAlpha *= a * u;
  rr(x, y, w, 60 + lines.length * 44, 20, "rgba(0,0,0,.88)", "rgba(74,222,128,.5)", 2); txt("OUTPUT", x + 30, y + 38, "24px Mono", "#4ade80");
  lines.forEach((s, k) => { if (t > t0 + .25 + k * .3) txt("> " + s, x + 30, y + 82 + k * 44, "34px Mono", k % 2 ? YEL : "#fff"); }); c.restore(); }
// --- background, header, captions ---
function bg(t) { c.fillStyle = "#070a14"; c.fillRect(0, 0, 1920, 1080); const g = c.createLinearGradient(0, 0, 1920, 1080); g.addColorStop(0, "#070a14"); g.addColorStop(1, "#0d1226"); c.fillStyle = g; c.fillRect(0, 0, 1920, 1080);
  [[400 + 200 * Math.sin(t * .4), 300, "rgba(255,106,43,.16)"], [1500 + 150 * Math.cos(t * .3), 800, "rgba(94,231,255,.14)"], [1000, 200 + 100 * Math.sin(t * .5), "rgba(123,97,255,.12)"]].forEach(([x, y, col]) => { const r = c.createRadialGradient(x, y, 0, x, y, 600); r.addColorStop(0, col); r.addColorStop(1, "rgba(0,0,0,0)"); c.fillStyle = r; c.fillRect(0, 0, 1920, 1080); });
  c.save(); c.globalAlpha = .06; c.strokeStyle = "#5ee7ff"; for (let x = -(t * 20) % 60; x < 1920; x += 60) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, 1080); c.stroke(); } for (let y = 0; y < 1080; y += 60) { c.beginPath(); c.moveTo(0, y); c.lineTo(1920, y); c.stroke(); } c.restore();
  const r = rand(5); for (let k = 0; k < 70; k++) { const x = r() * 1920, sp = 10 + r() * 30, y = (r() * 1080 - t * sp + 1080 * 50) % 1080; c.globalAlpha = .25 + .25 * r(); c.fillStyle = k % 4 ? CREAM : ORG; c.beginPath(); c.arc(x, y, 1.5 + r() * 2, 0, 7); c.fill(); } c.globalAlpha = 1; }
function header(t, chapter) { c.drawImage(badge, 40, 34); txt(`EP ${EP.ep} · ${(chapter || EP.topic).toUpperCase()}`, 1880, 77, "28px Mono", CREAM, "right");
  c.font = "28px Mono"; const tw = c.measureText(`EP ${EP.ep} · ${(chapter || EP.topic).toUpperCase()}`).width; rr(1880 - tw - 200, 40, 170, 52, 26, ORG); txt("LEARN", 1880 - tw - 115, 77, "700 28px Inter", "#fff", "center"); }
function captions(t) { const w = WORDS.filter(v => v[0] <= t + .05); if (!w.length) return; const cur = w[w.length - 1]; const ch = NJ.chunks.find(ch => ch.some(v => v[0] === cur[0])); if (!ch || t > ch[ch.length - 1][1] + .4) return;
  c.save(); c.font = "700 46px Inter"; const s = ch.map(v => v[2]).join(" "), tw = c.measureText(s).width; let x = 960 - tw / 2; rr(x - 26, 985, tw + 52, 74, 20, "rgba(7,10,20,.8)");
  for (const v of ch) { const on = v[0] === cur[0], ww = c.measureText(v[2]).width; if (on) rr(x - 8, 996, ww + 16, 52, 12, ORG); c.fillStyle = "#fff"; c.fillText(v[2], x, 1038); x += ww + c.measureText(" ").width; } c.restore(); }
